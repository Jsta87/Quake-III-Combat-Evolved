// Halo development controls. Executed by the launcher.
bind mouse2 "+button13"
bind g "qce_grenade_type"
bind q "weapnext"
bind mwheelup "qce_zoom_in"
bind mwheeldown "qce_zoom_out"
bind ctrl "+movedown"
bind r "+button12"
bind f "+button14"
bind e "+button10"
unbind t
bind l "toggle cg_qceFlashlight"
bind pgdn "qce_scorepage 1"
bind pgup "qce_scorepage -1"

// Large-lobby snapshot delivery. Extra launcher arguments can override these.
set snaps 30
set rate 250000
set sv_fps 30

// Refresh the development pickup scale even when an older value is archived.
set cg_qceWorldWeaponScale 1.65
