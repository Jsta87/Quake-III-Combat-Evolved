name: Build Quake foundation
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev
      - run: ./scripts/test-movement.sh
      - run: ./scripts/test-shields.sh
      - run: ./scripts/test-weapons.sh
      - run: ./scripts/test-melee.sh
      - run: ./scripts/test-headshots.sh
      - run: python3 ./tests/profile.py
      - run: python3 ./tests/halo-extraction.py
      - run: python3 ./tests/halo-assets.py
      - run: python3 ./tests/halo-animation.py
      - run: ./scripts/test-grenades.sh
      - run: ./scripts/test-needles.sh
      - run: ./scripts/test-heat.sh
      - run: ./scripts/test-network-state.sh
      - run: ./scripts/test-systems.sh
      - run: ./scripts/test-projectiles.sh
      - run: ./scripts/test-blasts.sh
      - run: ./scripts/test-spread.sh
      - run: ./scripts/test-swap.sh
      - run: ./scripts/build.sh server
      - run: ./build/server/RelWithDebInfo/ioq3ded --version
      - run: ./scripts/build.sh client
